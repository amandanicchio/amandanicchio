<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    @keyframes fadeSlide { from { opacity:0; transform:translateX(-18px); } to { opacity:1; transform:translateX(0); } }
    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
    @keyframes twinkle { 0%,100% { opacity:0.15; } 50% { opacity:0.75; } }
    @keyframes glow { 0%,100% { opacity:0.5; } 50% { opacity:0.9; } }
    .name { animation: fadeSlide 0.7s ease-out 0.1s both; }
    .role { animation: fadeSlide 0.7s ease-out 0.4s both; }
    .divider { animation: fadeIn 0.6s ease-out 0.6s both; }
    .tagline { animation: fadeSlide 0.7s ease-out 0.7s both; }
    .contacts { animation: fadeIn 0.7s ease-out 1.0s both; }
    .nameGlow { animation: glow 3.5s ease-in-out infinite; }
    .star1 { animation: twinkle 2.6s ease-in-out infinite; }
    .star2 { animation: twinkle 3.1s ease-in-out infinite 0.4s; }
    .star3 { animation: twinkle 2.3s ease-in-out infinite 0.8s; }
    .star4 { animation: twinkle 2.9s ease-in-out infinite 1.2s; }
    .star5 { animation: twinkle 2.4s ease-in-out infinite 0.6s; }
    .star6 { animation: twinkle 3.3s ease-in-out infinite 1.6s; }
    .star7 { animation: twinkle 2.7s ease-in-out infinite 0.2s; }
  </style>

  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bgA)"/>

  <!-- moldura decorativa pontilhada -->
  <rect x="18" y="18" width="1164" height="284" rx="14" fill="none" stroke="#333333" stroke-width="1" stroke-dasharray="2 6"/>

  <circle cx="0" cy="0" r="130" fill="#161616"/>
  <rect x="35" y="45" width="60" height="42" rx="4" fill="none" stroke="#e5e5e5" stroke-width="2.5"/>
  <line x1="35" y1="58" x2="95" y2="58" stroke="#e5e5e5" stroke-width="2.5"/>
  <circle cx="43" cy="51" r="1.8" fill="#e5e5e5"/>
  <circle cx="50" cy="51" r="1.8" fill="#e5e5e5"/>

  <circle cx="1200" cy="0" r="110" fill="#161616"/>
  <text x="1148" y="58" font-family="Consolas, monospace" font-size="30" fill="#eaeaea">&lt;/&gt;</text>

  <!-- estrelinhas espalhadas -->
  <text class="star1" x="955" y="50" font-size="22" fill="#aaaaaa">✦</text>
  <text class="star2" x="1010" y="150" font-size="14" fill="#999999">✧</text>
  <text class="star3" x="55" y="255" font-size="18" fill="#aaaaaa">✦</text>
  <text class="star4" x="150" y="60" font-size="12" fill="#888888">✧</text>
  <text class="star5" x="1080" y="230" font-size="16" fill="#999999">✦</text>
  <text class="star6" x="90" y="170" font-size="10" fill="#777777">✧</text>
  <text class="star7" x="1100" y="110" font-size="13" fill="#888888">✧</text>

  <ellipse class="nameGlow" cx="600" cy="120" rx="260" ry="60" fill="url(#glowGrad)"/>

  <g class="name">
    <text x="600" y="140" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#f5f5f5">Amanda Nicchio</text>
  </g>
  <g class="role">
    <text x="600" y="172" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#aaaaaa">SOFTWARE ENGINEERING STUDENT</text>
  </g>

  <g class="divider">
    <line x1="520" y1="186" x2="565" y2="186" stroke="#555555" stroke-width="1"/>
    <text x="600" y="190" text-anchor="middle" font-size="11" fill="#888888">✦</text>
    <line x1="635" y1="186" x2="680" y2="186" stroke="#555555" stroke-width="1"/>
  </g>

  <g class="tagline">
    <text x="600" y="213" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="18" fill="#949494">Aprendendo um pouco de cada coisa,</text>
    <text x="600" y="238" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="18" fill="#949494">todos os dias.</text>
  </g>

  <g class="contacts">
    <rect x="320" y="271" width="22" height="16" rx="2" fill="none" stroke="#cccccc" stroke-width="1.6"/>
    <path d="M320,271 L331,281 L342,271" stroke="#cccccc" stroke-width="1.6" fill="none"/>
    <text x="352" y="283" font-family="Consolas, monospace" font-size="13" fill="#cfcfcf">amandaramosnicchio@gmail.com</text>

    <text x="600" y="283" text-anchor="middle" font-size="12" fill="#666666">•</text>

    <circle cx="630" cy="278" r="10" fill="none" stroke="#cccccc" stroke-width="2"/>
    <path d="M626,278 l4,4 l6,-8" stroke="#cccccc" stroke-width="1.6" fill="none"/>
    <text x="650" y="283" font-family="Consolas, monospace" font-size="14" fill="#cfcfcf">github.com/amandanicchio</text>
  </g>
</svg>
